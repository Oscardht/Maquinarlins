<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maquinarlins - Calculadora Pro</title>
    <style>
        :root {
            --m-blue: #003366;
            --m-orange: #FF8C00;
            --m-white: #FFFFFF;
            --m-gray: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #dee2e6;
            margin: 0;
            padding: 20px;
        }

        .main-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--m-white);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: var(--m-blue);
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--m-orange);
        }

        .content-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
        }

        @media (max-width: 800px) {
            .content-layout { grid-template-columns: 1fr; }
        }

        .sidebar {
            padding: 25px;
            background: var(--m-gray);
            border-right: 1px solid #ddd;
        }

        .results-area { padding: 25px; }

        .input-group { margin-bottom: 15px; }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--m-blue);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus { border-color: var(--m-orange); outline: none; }

        .mode-selector {
            background: #e9ecef;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        .btn-calc {
            width: 100%;
            background: var(--m-orange);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.3s;
        }

        .btn-calc:hover { background: #e67e00; }

        /* Tarjetas de Resumen */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .card {
            padding: 15px;
            border-radius: 8px;
            color: white;
        }

        .card-blue { background: var(--m-blue); }
        .card-orange { background: var(--m-orange); }

        .card-label { font-size: 0.75rem; text-transform: uppercase; display: block; }
        .card-value { font-size: 1.4rem; font-weight: bold; }

        /* Tabla */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #f1f3f5;
            color: var(--m-blue);
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
        }

        td { padding: 10px; border-bottom: 1px solid #eee; font-size: 0.95rem; }

        .badge {
            padding: 4px 8px;
            background: #e9ecef;
            border-radius: 4px;
            font-weight: bold;
            color: var(--m-blue);
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header">
        <h1 style="margin:0; letter-spacing: 2px;">MAQUINARLINS</h1>
        <small>Sistemas de Proyección Financiera</small>
    </div>

    <div class="content-layout">
        <div class="sidebar">
            <div class="mode-selector">
                <label>Modo de Presupuesto</label>
                <select id="modo" onchange="alternarCampos()">
                    <option value="financiamiento">Financiamiento (Interés)</option>
                    <option value="contado">Contado (Costo de Uso)</option>
                </select>
            </div>

            <div class="input-group">
                <label>Inversión Inicial ($)</label>
                <input type="number" id="capital" value="50000">
            </div>

            <div class="input-group">
                <label>Frecuencia de Tiempo</label>
                <select id="frecuencia" onchange="actualizarLabels()">
                    <option value="Mes">Mensual</option>
                    <option value="Trimestre">Trimestral</option>
                    <option value="Semestre">Semestral</option>
                    <option value="Año">Anual</option>
                </select>
            </div>

            <div class="input-group">
                <label id="lblPlazo">Cantidad de Meses</label>
                <input type="number" id="plazo" value="12">
            </div>

            <div class="input-group" id="grupoVariable">
                <label id="lblVariable">Tasa de Interés por Mes (%)</label>
                <input type="number" id="valorVariable" value="2" step="0.01">
            </div>

            <div class="input-group" id="grupoMetodo">
                <label>Tipo de Interés</label>
                <select id="metodo">
                    <option value="simple">Interés Simple (Fijo)</option>
                    <option value="compuesto">Interés Compuesto (Sobre saldo)</option>
                </select>
            </div>

            <button class="btn-calc" onclick="calcular()">GENERAR PROYECCIÓN</button>
        </div>

        <div class="results-area">
            <div class="summary-cards">
                <div class="card card-blue">
                    <span class="card-label" id="labelFinal">Inversión Final Total</span>
                    <span id="resTotal" class="card-value">$0.00</span>
                </div>
                <div class="card card-orange">
                    <span class="card-label" id="labelCuota">Cuota/Costo Periodo</span>
                    <span id="resCuota" class="card-value">$0.00</span>
                </div>
                <div class="card card-blue" style="opacity: 0.9;">
                    <span class="card-label" id="labelExtra">Total Adicional</span>
                    <span id="resExtra" class="card-value">$0.00</span>
                </div>
            </div>

            <h3 id="tituloTabla" style="color: var(--m-blue);">Proyección Detallada</h3>
            <table>
                <thead>
                    <tr>
                        <th>Periodo</th>
                        <th>Saldo Inicial</th>
                        <th id="thAccion">Interés/Uso</th>
                        <th>Saldo Acumulado</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTabla"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function alternarCampos() {
        const modo = document.getElementById('modo').value;
        const freq = document.getElementById('frecuencia').value;
        const lblVar = document.getElementById('lblVariable');
        const grupoMetodo = document.getElementById('grupoMetodo');
        const thAccion = document.getElementById('thAccion');

        if (modo === 'contado') {
            lblVar.innerText = `Costo de Mantenimiento por ${freq} ($)`;
            document.getElementById('valorVariable').value = 500;
            grupoMetodo.style.display = 'none';
            thAccion.innerText = "Costo de Uso";
            document.getElementById('labelExtra').innerText = "Total Mantenimiento";
        } else {
            lblVar.innerText = `Tasa de Interés por ${freq} (%)`;
            document.getElementById('valorVariable').value = 2;
            grupoMetodo.style.display = 'block';
            thAccion.innerText = "Interés Aplicado";
            document.getElementById('labelExtra').innerText = "Total Intereses";
        }
        calcular();
    }

    function actualizarLabels() {
        const freq = document.getElementById('frecuencia').value;
        const modo = document.getElementById('modo').value;
        document.getElementById('lblPlazo').innerText = `Cantidad de ${freq}es`;
        
        if (modo === 'financiamiento') {
            document.getElementById('lblVariable').innerText = `Tasa de Interés por ${freq} (%)`;
        } else {
            document.getElementById('lblVariable').innerText = `Costo de Mantenimiento por ${freq} ($)`;
        }
    }

    function calcular() {
        const modo = document.getElementById('modo').value;
        const P = parseFloat(document.getElementById('capital').value);
        const n = parseInt(document.getElementById('plazo').value);
        const vVar = parseFloat(document.getElementById('valorVariable').value);
        const freqLabel = document.getElementById('frecuencia').value;
        const money = (val) => new Intl.NumberFormat('en-US', {style: 'currency', currency: 'USD'}).format(val);

        let acumulado = P;
        let tablaHTML = "";
        let totalExtra = 0;

        for (let i = 1; i <= n; i++) {
            let saldoInicial = acumulado;
            let incremento = 0;

            if (modo === 'financiamiento') {
                const r = vVar / 100;
                const metodo = document.getElementById('metodo').value;
                incremento = (metodo === 'simple') ? (P * r) : (acumulado * r);
            } else {
                // Modo contado: Simplemente sumamos el mantenimiento
                incremento = vVar;
            }

            acumulado += incremento;
            totalExtra += incremento;

            tablaHTML += `
                <tr>
                    <td><span class="badge">${freqLabel} ${i}</span></td>
                    <td>${money(saldoInicial)}</td>
                    <td>${money(incremento)}</td>
                    <td><strong>${money(acumulado)}</strong></td>
                </tr>
            `;
        }

        document.getElementById('resTotal').innerText = money(acumulado);
        document.getElementById('resCuota').innerText = money(acumulado / n);
        document.getElementById('resExtra').innerText = money(totalExtra);
        document.getElementById('cuerpoTabla').innerHTML = tablaHTML;
        document.getElementById('tituloTabla').innerText = `Proyección a ${n} ${freqLabel}(es) - Modo ${modo.toUpperCase()}`;
    }

    window.onload = () => {
        actualizarLabels();
        calcular();
    };
</script>

</body>
</html>

?>
